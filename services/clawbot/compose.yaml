# Deployment compose — pasted into Dockge's Stack editor on the Pi.
# No `build:` block: the Pi pulls the image from the private registry.
# For local Docker iteration, use compose.dev.yaml instead.

services:
  clawbot:
    image: ${REGISTRY_URL:-192.168.0.110:5000}/clawbot:${TAG:-latest}
    container_name: clawbot
    restart: unless-stopped
    environment:
      CLAW_PORT: "8080"
      CLAW_HOST: "0.0.0.0"
      CLAW_DATA_DIR: /app/services/clawbot/data
      ILINK_BOT_TYPE: "${ILINK_BOT_TYPE:-3}"
      CLAW_BOT_AGENT: "${CLAW_BOT_AGENT:-clawbot/0.1.0}"
      LLM_API_KEYS: "${LLM_API_KEYS:-}"
      LLM_API_BASE_URL: "${LLM_API_BASE_URL:-https://dashscope-intl.aliyuncs.com}"
      LLM_COMPAT_BASE_URL: "${LLM_COMPAT_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}"
      WORKER_URL_CTXD: "${WORKER_URL_CTXD:-}"
      CLAW_WORKER_SECRET: "${CLAW_WORKER_SECRET:-}"
      ALERT_TELEGRAM_BOT_TOKEN: "${ALERT_TELEGRAM_BOT_TOKEN:-}"
      ALERT_TELEGRAM_CHAT_ID: "${ALERT_TELEGRAM_CHAT_ID:-}"
      CLAW_UI_URL: "${CLAW_UI_URL:-}"
    ports:
      - "${CLAW_HOST_PORT:-8765}:8080"
    volumes:
      # Pi 上请改成绝对路径，例如 /opt/clawbot/data
      - /opt/clawbot/data:/app/services/clawbot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
