name = "katakana-bot"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[vars]
# Soft cap on auto-registered private chats. First N who DM the bot get in.
MAX_CHATS = "50"

# KV for chat whitelist + counter. Create with:
#   pnpm wrangler kv namespace create CHATS
# then paste the returned id below.
[[kv_namespaces]]
binding = "CHATS"
id = "de08d0d43e084c91bee6850aaddabcfe"

# Secrets (set via `pnpm wrangler secret put <NAME>`):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_WEBHOOK_SECRET
#   CLAW_WORKER_SECRET   shared with clawbot; gates POST /ilink (fails closed: 503 if unset)

[[kv_namespaces]]
binding = "KATAKANA_CACHE"
id = "8d69b3522195498dabb8cf3dd2978eb2"
