name = "katakana-bot"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[vars]
# Your Telegram chat id — non-secret, fine to commit.
ALLOWED_CHAT_ID = "6950532953"

# KV cache for Jisho responses. Uncomment after running:
