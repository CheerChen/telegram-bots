name = "toho-ticket-bot"
main = "src/index.ts"
compatibility_date = "2026-06-16"

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "TOHO_STATE"
id = "3ff62b0d9fec481b9b65f50413cec4a4"

# Secrets (set via `pnpm secrets:push` after filling .dev.vars):
#   TELEGRAM_BOT_TOKEN      — bot token from @BotFather
#   TELEGRAM_WEBHOOK_SECRET — random string for webhook verification
#   TELEGRAM_CHAT_ID        — optional; admin chat for error alerts
