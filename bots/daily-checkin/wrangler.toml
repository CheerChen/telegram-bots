name = "daily-checkin"
main = "src/index.ts"
compatibility_date = "2026-06-16"

[observability]
enabled = true

[triggers]
# JST weekdays. NB: CF cron weekdays are 1-7 with 1=Sunday (Quartz-style,
# NOT the standard 0=Sunday). At late UTC hours the JST day has already
# shifted forward, so DOW must be the UTC weekday of the day BEFORE.
#   07:55 JST Mon-Fri = 22:55 UTC Sun-Thu  -> 1-5
# Merged from 3 crons to 1 to free up Workers Free cron trigger quota.
# The 09:40 in-place update and 10:00 retry passes were dropped; the 07:55
# send is idempotent via the KV "sent today" key.
crons = ["55 22 * * 1-5"]

[[kv_namespaces]]
binding = "CHECKIN_STATE"
id = "ba110c019ed7448389ecee7adbf427b2"

[vars]
PUBLIC_URL = "https://daily-checkin.cheerchen37.workers.dev"
MEETING_TITLE_BLACKLIST = "キャンセル済み,【#DBRE】DS"
MIN_MEETING_TITLE_LENGTH = "5"

# Secrets (set via `pnpm secrets:push` after filling .dev.vars):
#   OUTLOOK_ICS_URL       Outlook published calendar ICS URL (fallback path)
#   AZURE_CLIENT_ID       Entra app registration (public client + PKCE)
#   AZURE_TENANT_ID
#   JIRA_BASE_URL
#   JIRA_EMAIL
#   JIRA_API_TOKEN
#   SLACK_BOT_TOKEN
#   SLACK_DM_CHANNEL_ID   U... user id (IM auto-opened) or D.../C... channel id
#   ADMIN_SECRET          gates /run, /preview and /auth/start
#
# KV layout (CHECKIN_STATE):
#   graph:refresh_token    current Entra refresh token (rotated on every use)
#   checkin:today:<date>   { ts, digest } from the day's first successful send (TTL 4d);
#                          doubles as the "already sent" lock; the 09:40 pass
#                          chat.update's this message when the digest changed
#   pkce:<state>           code_verifier during an in-flight /auth flow (TTL 10 min)
