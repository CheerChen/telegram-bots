name = "ctxd-bot"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[vars]
ALLOWED_CHAT_ID = "6950532953"

# Aliyun DashScope OpenAI-compatible endpoint (international).
LLM_BASE_URL = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
LLM_MODEL = "deepseek-v4-pro"

# KV for per-chat session state. Run once:
#   pnpm wrangler kv namespace create CTXD_SESSIONS
# then paste the returned id below and uncomment.
[[kv_namespaces]]
binding = "CTXD_SESSIONS"
id = "5e5c6e5b16e04b609eb82e312c6cbd52"

# Secrets (set via `pnpm secrets:push` after filling .dev.vars):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_WEBHOOK_SECRET
#   LLM_API_KEY            (DashScope API key)
#   SLACK_USER_TOKEN       (xoxp-...)
#   CLAW_WORKER_SECRET     (shared with clawbot for POST /ilink)
#   ATLASSIAN_BASE_URL     (https://xxx.atlassian.net)
#   ATLASSIAN_EMAIL        (your Atlassian account email)
#   ATLASSIAN_API_TOKEN    (Atlassian API token — same creds for Jira & Confluence)
